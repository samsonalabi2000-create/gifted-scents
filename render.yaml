# Optional Render blueprint. Any host works; nothing in the app depends on this file.
services:
  - type: web
    name: gifted-scents-api
    runtime: node
    rootDir: server
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run db:search
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: DATABASE_URL, sync: false }
      - { key: CLIENT_URL, sync: false }
      - { key: SERVER_URL, sync: false }
      - { key: JWT_ACCESS_SECRET, generateValue: true }
      - { key: JWT_REFRESH_SECRET, generateValue: true }
      - { key: PAYSTACK_SECRET_KEY, sync: false }
      - { key: PAYSTACK_PUBLIC_KEY, sync: false }
      - { key: STORAGE_PROVIDER, value: cloudinary }
      - { key: CLOUDINARY_CLOUD_NAME, sync: false }
      - { key: CLOUDINARY_API_KEY, sync: false }
      - { key: CLOUDINARY_API_SECRET, sync: false }
      - { key: AI_API_KEY, sync: false }
      - { key: COOKIE_SAMESITE, value: none }
